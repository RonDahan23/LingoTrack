# This file was auto-generated by the Firebase CLI
# https://github.com/firebase/firebase-tools

name: Deploy to Firebase Hosting on merge
on:
  push:
    branches:
      - main
jobs:
  build_and_deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      # Without this the build falls back to http://localhost:3000 (see
      # frontend/src/config.ts) and the deployed SPA cannot reach the API.
      # Not a secret: it is a public URL, already baked into the shipped JS.
      - run: cd frontend && npm ci && npm run build
        env:
          VITE_API_BASE_URL: https://lingotrack-backend.onrender.com
      - uses: FirebaseExtended/action-hosting-deploy@v0
        with:
          repoToken: ${{ secrets.GITHUB_TOKEN }}
          firebaseServiceAccount: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_LINGOTRACK_7CB80 }}
          channelId: live
          projectId: lingotrack-7cb80
